name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Setup test database
        run: bun run test:db:setup

      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Run unit tests
        run: bun run test:unit
        env:
          NODE_ENV: test
          DATABASE_PROVIDER: sqlite
          DATABASE_URL: "file:./test.sqlite"
          # In-memory cache/KV: no Redis service required (see src/lib/kv.ts).
          CACHE_DRIVER: memory
          REDIS_KEY_PREFIX: "test:"
          SESSION_SECRET: test-secret-for-ci
          ADMIN_PASSWORD: test-password
          LOG_LEVEL: trace
          LOG_TO_CONSOLE: true
          LOG_TO_FILE: false

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  e2e:
    name: E2E Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Setup test database
        run: bun run test:db:setup

      - name: Build application
        run: bun run build
        env:
          NODE_ENV: production
          DATABASE_PROVIDER: sqlite
          DATABASE_URL: "file:./test.sqlite"
          # In-memory cache/KV: no Redis service required (see src/lib/kv.ts).
          CACHE_DRIVER: memory
          REDIS_KEY_PREFIX: "test:"
          SESSION_SECRET: test-secret-for-ci
          ADMIN_PASSWORD: test-password

      - name: Run E2E tests
        run: bun test tests/e2e --skip "should render file/video/audio embeds from markdown attachment tags in the WYSIWYG" --skip "should preserve markdown attachment tags through WYSIWYG round-trip" --skip "should collapse the markdown preview divider and still persist + display an update"
        env:
          NODE_ENV: production
          DATABASE_PROVIDER: sqlite
          DATABASE_URL: "file:./test.sqlite"
          # In-memory cache/KV: no Redis service required (see src/lib/kv.ts).
          CACHE_DRIVER: memory
          REDIS_KEY_PREFIX: "test:"
          SESSION_SECRET: test-secret-for-ci
          ADMIN_PASSWORD: test-password
          LOG_LEVEL: error
